id = "royal-lobster.spinup"
name = "Spinup"
version = "0.3.0"
min_herdr_version = "0.8.0"
description = "Every new tab opens a launcher: pick a tool and it runs in that tab. Tools are yours to define in tools.json."
platforms = ["linux", "macos"]

# ---------------------------------------------------------------------------
# The whole plugin: one event.
#
# On a new tab, the menu is run in that tab's own pane. Picking a tool `exec`s it
# there, so nothing else is created and no existing tab is touched; `esc` picks
# nothing and the shell returns to its prompt.
#
# No [[panes]] and no [[actions]] are needed for that, and no keybindings are
# declared: keys are read by the *client*, and a client driving a remote server has
# no local plugin registry and no local server, so it can neither resolve nor run a
# plugin action. Events are raised and handled entirely on the server, which is why
# this trigger works everywhere.
#
# Absolute path via $HERDR_PLUGIN_ROOT: the plugin directory is the working
# directory for actions only, and this hook's cwd is not guaranteed.
# ---------------------------------------------------------------------------

[[events]]
on = "tab.created"
command = ["sh", "-c", 'exec node "$HERDR_PLUGIN_ROOT/src/tab-event.js"']
