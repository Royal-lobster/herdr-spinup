# Spinup tools. Copied to $HERDR_PLUGIN_CONFIG_DIR/tools.toml on first run — edit
# that copy, not this file (a GitHub-installed plugin is a managed checkout and
# your changes here would be lost on update). Find it with:
#
#   herdr plugin config-dir royal-lobster.spinup
#
# Each entry becomes a row in the picker and opens in its own tab.
#
#   id       required, unique. Identifies the pane so a running tool is reused
#            rather than started twice.
#   command  required. A shell command line, so quoting and flags work as usual.
#            Shell *aliases* do not exist here — name the real binary.
#   label    optional, defaults to id. Shown in the picker and as the tab name.
#   desc     optional. Dim text on the right of the row.
#   key      optional single character shortcut. Defaults to the row number.

[[tools]]
id = "fresh"
command = "fresh"
desc = "editor"

[[tools]]
id = "tuicr"
command = "tuicr"
desc = "review"

[[tools]]
id = "cc"
command = "claude --permission-mode auto"
desc = "claude"

[[tools]]
id = "cdx"
command = "codex --yolo"
desc = "codex"
